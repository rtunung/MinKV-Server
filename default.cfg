# The port on which the server will be listening
port = 5555

# Max message size. Maximum of bytes that can be read before connection is shut down.
# Used to prevent memory attacks on the server/stop erroneous requests
max_message_size = 1048576

# If true, then use TLS instead of plain TCP. The key and certification files must be set correctly.
tls = false
key_file = server.key
cert_file = server.crt

# Set path to log file. If empty or missing there will be no logs saved to the disk
log_file = minkv.log
# If true log debug messages as well
log_debug = true
# Set number of rotating log files
num_log_files = 5
# Set maximum size in bytes per log file
max_log_size = 5242880

# If true, then authentification via user login is required, before data can be read or written to the server
authentication_required = false
# Points to the sqlite database, that stores the user data
user_database = users.db

# Specifies the number of threads
num_threads = 2
# Clean up Timer. Time period for purging expired records. Time in milliseconds
ex_clean_up_timer =  25
